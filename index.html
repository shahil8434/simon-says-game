<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simon Says Game</title>

    <link rel="stylesheet" href="File.css">

    <link rel="icon" href="data:,">
</head>

<body>
    <div id = "login-page">

        <h1>Simon-Says-Game</h1>
        <input type="text" id = "username" placeholder="Username">
        <br>
        <input type="email" id = "email" placeholder="Enter your emai id">
        <br>
        <input type="password" id = "password" placeholder="Enter your Password">
        <br>
        <button id = "login-btn">Login</button>

    </div>
    
    <div id="game-page">
    <h1>Simon Says Game</h1>

    <h2 id="message">Press any key to start the game</h2>

    <p id="score">Highest Score: 0</p>

    <div class="btn-container">

        <div class="line-one">
            <div class="btn one" id="yellow">1</div>
            <div class="btn two" id="red">2</div>
        </div>

        <div class="line-two">
            <div class="btn three" id="purple">3</div>
            <div class="btn four" id="green">4</div>
        </div>

    </div>
</div>

    <script src="File.js"></script>

</body>

</html>
